name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'integrations/home-assistant'
  workflow_dispatch:

concurrency:
  group: songloft-release-${{ github.ref_type == 'tag' && 'tag' || 'dev' }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'
  FLUTTER_VERSION: '3.44.6'
  RELEASE_REPO: ${{ github.repository }}

jobs:
  # ============================================================
  # Job 1: 准备版本号与环境信息
  # ============================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      version_tag: ${{ steps.parse.outputs.version_tag }}
      release_tag: ${{ steps.parse.outputs.release_tag }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      release_title: ${{ steps.parse.outputs.release_title }}
      previous_tag: ${{ steps.prev-tag.outputs.previous_tag }}
      build_time: ${{ steps.parse.outputs.build_time }}
      git_commit: ${{ steps.parse.outputs.git_commit }}
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this run should proceed
        id: gate
        run: |
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Parse version info
        id: parse
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION_TAG="${VERSION#v}"
            IS_PRERELEASE="false"
            RELEASE_TITLE="Release ${VERSION}"
          else
            VERSION="dev"
            VERSION_TAG="dev"
            IS_PRERELEASE="true"
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S')
            RELEASE_TITLE="Xiaomi 14 Build (${TIMESTAMP} UTC)"
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          RELEASE_TAG="${VERSION}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "git_commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT

          echo "Version: ${VERSION}"
          echo "Release Tag: ${RELEASE_TAG}"

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git --no-pager tag --sort=-creatordate | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD || echo "unknown")
          fi
          echo "previous_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 2: 仅构建适合小米14的 Android arm64-v8a APK（嵌入式 Go 后端）
  # ============================================================
  build-bundled-android:
    name: Bundled Android (Xiaomi 14 / arm64-v8a)
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        run: |
          git submodule update --init --recursive -- clients/player
          git submodule update --init --recursive -- pkg/tag

      # 应用解决车机蓝牙歌词卡顿的优化源码补丁
      - name: Apply player patches
        run: |
          cd clients/player
          git apply "$GITHUB_WORKSPACE/patches/player_bluetooth_lyric.patch" || (echo "Patch fallback to direct copy" && cp -r "$GITHUB_WORKSPACE/patches/files/"* .)
          git status

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build Go backend as Android .aar
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TRACELY_APP_ID: ${{ secrets.TRACELY_APP_ID }}
          TRACELY_APP_SECRET: ${{ secrets.TRACELY_APP_SECRET }}
          TRACELY_HOST: ${{ secrets.TRACELY_HOST }}
        run: make build-go-mobile-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: |
          cd clients/player
          flutter pub get

      - name: Compute native contract hash (bake asset)
        run: |
          cd clients/player
          HASHES=$(./scripts/compute_native_contract.sh \
            --export-surface ../mobile/export_surface.txt \
            --write-asset android/app/src/main/assets/native_contract.json)
          echo "native_contract.json = $HASHES"
          DART_CONTRACT_HASH=$(printf '%s' "$HASHES" | sed -n 's/.*"dart":"\([a-f0-9]*\)".*/\1/p')
          GO_CONTRACT_HASH=$(printf '%s' "$HASHES" | sed -n 's/.*"go":"\([a-f0-9]*\)".*/\1/p')
          echo "DART_CONTRACT_HASH=$DART_CONTRACT_HASH" >> "$GITHUB_ENV"
          echo "GO_CONTRACT_HASH=$GO_CONTRACT_HASH" >> "$GITHUB_ENV"

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.jks
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi

      - name: Build APK for Xiaomi 14 (arm64-v8a)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd clients/player
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --dart-define=HAS_BACKEND=true \
            --dart-define=FRONTEND_VERSION=${{ needs.prepare.outputs.version_tag }} \
            --dart-define=FRONTEND_BUILD_TIME=${{ needs.prepare.outputs.build_time }} \
            --dart-define=FRONTEND_GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} \
            --dart-define=FLUTTER_BINDING=${{ env.FLUTTER_VERSION }}

      - name: Collect APK
        run: |
          cd clients/player
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/songloft-bundled-android-arm64-v8a.apk"
          ls -lh "$GITHUB_WORKSPACE/songloft-bundled-android-arm64-v8a.apk"

      - name: Produce hot-update patch assets
        env:
          REPO: ${{ env.RELEASE_REPO }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          SEMVER: ${{ needs.prepare.outputs.version_tag }}
          GIT_COMMIT: ${{ needs.prepare.outputs.git_commit }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
          FLUTTER_BINDING: ${{ env.FLUTTER_VERSION }}
        run: |
          set -e
          cd clients/player
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ -f "$apk" ]; then
            ABI_VC=$("$BUILD_TOOLS_DIR/aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            LABEL="${SEMVER}-${GIT_COMMIT}"
            rm -rf dist
            dart run flutter_patcher:pack --apk "$apk" --version "$LABEL" \
              --target-version-code "$ABI_VC" --abi "arm64-v8a"
            cp dist/patch.zip "$GITHUB_WORKSPACE/patch-arm64-v8a-${GIT_COMMIT}.zip"
            ZIP_MD5=$(md5sum "$GITHUB_WORKSPACE/patch-arm64-v8a-${GIT_COMMIT}.zip" | cut -d' ' -f1)
            cat > "$GITHUB_WORKSPACE/manifest-arm64-v8a.json" <<EOF
          {
            "hasUpdate": true,
            "patch": {
              "version": "${LABEL}",
              "semanticVersion": "${SEMVER}",
              "gitCommit": "${GIT_COMMIT}",
              "flutterBinding": "${FLUTTER_BINDING}",
              "contractHash": "${DART_CONTRACT_HASH}",
              "targetVersionCode": ${ABI_VC},
              "patchUrl": "https://github.com/${REPO}/releases/download/${TAG}/patch-arm64-v8a-${GIT_COMMIT}.zip",
              "md5": "${ZIP_MD5}"
            }
          }
          EOF
            unzip -p "$apk" "lib/arm64-v8a/libgojni.so" > "$GITHUB_WORKSPACE/libgojni-arm64-v8a-${GIT_COMMIT}.so" || true
          fi

      - name: Upload bundled Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: songloft-bundled-android-arm64-v8a
          path: |
            songloft-bundled-android-arm64-v8a.apk
            manifest-arm64-v8a.json
            patch-arm64-v8a-*.zip
          retention-days: 30

  # ============================================================
  # Job 3: 发布 GitHub Release
  # ============================================================
  create-release:
    name: Create Release
    needs: [prepare, build-bundled-android]
    if: always() && needs.build-bundled-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bundled Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: songloft-bundled-android-arm64-v8a
          path: release-files

      - name: Generate checksums
        run: |
          cd release-files
          sha256sum $(ls | grep -v checksums.txt) > checksums.txt
          echo "=== checksums.txt ==="
          cat checksums.txt
          ls -lh

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          cd release-files
          FILES=($(ls))
          echo "Uploading ${#FILES[@]} files..."

          if gh release view "${RELEASE_TAG}" --repo "${{ env.RELEASE_REPO }}" > /dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists, deleting old one..."
            gh release delete "${RELEASE_TAG}" --repo "${{ env.RELEASE_REPO }}" --yes || true
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          ### Songloft for Xiaomi 14 (arm64-v8a)
          
          - 针对小米14连接21款君越等车载蓝牙播放音乐时歌词卡顿的问题进行了系统级优化：
            1. 参考 **lx-music-mobile** 的设计，增加了「车载蓝牙与系统通知歌词」独立设置开关（默认关闭）。
            2. 关闭时完全切断向 MediaSession 与蓝牙 AVRCP 高频刷新元数据，车机仅显示固定歌曲与歌手名，杜绝车载蓝牙协议栈拥塞与主线程 Binder 反压卡顿，使手机端歌词动画在 120Hz 高刷下流畅顺滑。
            3. 在开启时加入了防抖节流限制（最小间隔 800ms），防止短时间密集跳行引发蓝牙传输延迟。
          EOF

          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            gh release create "${RELEASE_TAG}" \
              --repo "${{ env.RELEASE_REPO }}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${NOTES_FILE}" \
              --prerelease \
              "${FILES[@]}" || true
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${{ env.RELEASE_REPO }}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${NOTES_FILE}" \
              "${FILES[@]}" || true
          fi
